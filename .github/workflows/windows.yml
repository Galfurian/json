name: Windows

# Trigger the workflow on push or pull requests for main and develop branches
on:
  push:
    branches:
    - main
    - develop
    paths:
    - '**/*.c'
    - '**/*.cpp'
    - '**/*.h'
    - '**/*.hpp'
    - '**/CMakeLists.txt'
    - '**/Makefile'
    - '**/cmake/**'
    - '.github/workflows/windows.yml'
  pull_request:
    branches:
    - main
    - develop
    paths:
    - '**/*.c'
    - '**/*.cpp'
    - '**/*.h'
    - '**/*.hpp'
    - '**/CMakeLists.txt'
    - '**/Makefile'
    - '**/cmake/**'
    - '.github/workflows/windows.yml'

jobs:
  build:
    name: Build and Test (Windows, ${{ matrix.name }})
    runs-on: windows-latest

    strategy:
      # Continue running other matrix jobs even if one fails.
      fail-fast: false
      matrix:
        include:
          - { name: "MSVC Debug", config: Debug, generator: "" }
          - { name: "MSVC Release", config: Release, generator: "" }
          - { name: "ClangCL Release", config: Release, generator: "-T ClangCL" }
          - { name: "MinGW Release", config: Release, generator: '-G "MinGW Makefiles"' }

    steps:
    # Step: Clone the project.
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step: Configure Project.
    - name: Configure Project
      run: |
        cmake -B build ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON -DWARNINGS_AS_ERRORS=ON -DSTRICT_WARNINGS=ON

    # Step: Build Project.
    - name: Build Project
      run: |
        cmake --build build --config ${{ matrix.config }} --parallel 2

    # Step: Run Tests.
    - name: Run Tests
      run: |
        ctest --test-dir build --build-config ${{ matrix.config }} --output-on-failure
