name: Sanitizers

# Run the tests with AddressSanitizer and UndefinedBehaviorSanitizer.
on:
  push:
    branches:
    - main
    - develop
    paths:
    - '**/*.cpp'
    - '**/*.hpp'
    - '**/CMakeLists.txt'
    - '.github/workflows/sanitizers.yml'
  pull_request:
    branches:
    - main
    - develop
    paths:
    - '**/*.cpp'
    - '**/*.hpp'
    - '**/CMakeLists.txt'
    - '.github/workflows/sanitizers.yml'

jobs:
  sanitizers:
    name: ASan and UBSan (${{ matrix.cxx }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          [
            { cc: gcc-13, cxx: g++-13, pkgs: "gcc-13 g++-13" },
            { cc: clang-18, cxx: clang++-18, pkgs: "clang-18" },
          ]

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.pkgs }}

    - name: Configure Project
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=${{ env.CC }} \
          -DCMAKE_CXX_COMPILER=${{ env.CXX }} \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=OFF

    - name: Build Project
      run: cmake --build build --parallel 2

    - name: Run Tests
      run: ctest --test-dir build --output-on-failure
